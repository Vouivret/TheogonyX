name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .NET のバージョンは docs/nfr.md の「対応環境」に合わせる
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: README の「確認」コマンド
        run: sh scripts/check.sh
