<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title data-i18n="TITLE"></title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main class="companion">
      <section class="world">
        <canvas id="world-canvas" class="world-canvas" width="480" height="270"></canvas>
        <p id="request-bubble" class="request-bubble" hidden></p>
        <p id="status" class="status" role="status"></p>
      </section>
      <section class="cards" aria-labelledby="cards-title">
        <h2 id="cards-title" class="cards-title" data-i18n="CARDS_TITLE"></h2>
        <p id="dream-guide" class="dream-guide"></p>
        <div id="dream-row" class="dream-row">
          <div id="dream-nodes" class="dream-buttons"></div>
          <button id="oracle-button" class="oracle-button" type="button" data-i18n="BUTTON_ORACLE"></button>
        </div>
        <div id="dream-cards" class="dream-row" hidden>
          <div id="card-buttons" class="dream-buttons"></div>
          <button id="cancel-button" type="button" data-i18n="BUTTON_CANCEL"></button>
        </div>
      </section>
    </main>
  </body>
</html>
