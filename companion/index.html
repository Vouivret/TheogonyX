<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title data-i18n="TITLE"></title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main class="companion">
      <section class="world">
        <canvas id="world-canvas" class="world-canvas" width="480" height="270"></canvas>
        <p id="request-bubble" class="request-bubble" hidden></p>
        <p id="status" class="status" role="status"></p>
      </section>
      <section class="oracle" aria-labelledby="oracle-title">
        <h2 id="oracle-title" class="oracle-title" data-i18n="ORACLE_TITLE"></h2>
        <p id="dream-guide" class="dream-guide"></p>
        <div id="voice-row" class="dream-row">
          <input id="god-text" class="god-text" type="text" maxlength="80" autocomplete="off" data-i18n-placeholder="SPEAK_PLACEHOLDER">
          <button id="speak-button" class="oracle-button" type="button" data-i18n="BUTTON_SPEAK"></button>
        </div>
        <div id="words-row" class="dream-row" hidden>
          <select id="noun-select" class="word-select"></select>
          <select id="verb-select" class="word-select"></select>
          <select id="destination-select" class="word-select"></select>
          <button id="choose-button" class="oracle-button" type="button" data-i18n="BUTTON_SPEAK"></button>
        </div>
        <div id="told" class="told" hidden>
          <p id="told-line" class="told-line"></p>
          <p id="told-heard" class="told-text"></p>
          <p id="told-narration" class="told-text"></p>
          <p id="told-destination" class="told-text"></p>
          <p id="told-mystery" class="told-text"></p>
        </div>
        <details id="book" class="book">
          <summary data-i18n="BOOK_TITLE"></summary>
          <ul id="book-list" class="book-list"></ul>
        </details>
      </section>
    </main>
  </body>
</html>
